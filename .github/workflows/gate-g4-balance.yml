name: G4 Balance Gate

# Headless simulation over Core. Needs no Unity licence, because Core is
# engine-free and deterministic — the same seed produces the same numbers here as
# on the founder's machine, which is what makes a CI result worth comparing.
#
# Scope note: this gate currently checks structural invariants only — merge
# premium, monotonic DPS, finite values, frame-rate independence, seed
# determinism. Run length, win rate and softlock detection need a combat model
# that Core does not have yet, and inventing thresholds for them would produce
# numbers that look like decisions nobody made.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # 03:00 UTC nightly. The sim is the one thing that produces real value while
    # the founder sleeps, so it runs whether or not anyone pushed.
    - cron: '0 3 * * *'

concurrency:
  group: g4-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  balance:
    name: T3 structural invariants
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1

    steps:

      # Evidence emission removed with the split -- emit-evidence.sh and the schema
      # that governs these records live in the JARVIS repository now. Reporting this
      # gate's result back to JARVIS across repositories is an open integration
      # question; a step that silently fails would not have answered it.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Sim/**/*.csproj','Tools/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # A nightly sweep is wider than a per-push one: more seeds, more chance of
      # catching an edge case nobody wrote a test for.
      - name: Run simulation
        id: sim
        run: |
          RUNS=${{ github.event_name == 'schedule' && '10000' || '1000' }}
          dotnet run --project Sim/MergeSurvivor.Sim/MergeSurvivor.Sim.csproj \
            -c Release -- --seed 12345 --runs "$RUNS" \
            --out Sim/metrics.json

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g4-metrics-${{ github.run_number }}
          path: Sim/metrics.json
          if-no-files-found: warn
