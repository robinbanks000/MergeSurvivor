name: G2 Code Gate

# The gate that has no override. If this is red, nothing merges.
#
# Every check runs through ./Studio/build/gate-g2.sh — the same script the founder
# runs locally. Reimplementing the steps in YAML would let CI and local runs drift
# apart, and "it passes on my machine" is exactly the failure this gate exists to
# prevent.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: g2-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: T0 static + T1 unit and contract tests
    runs-on: ubuntu-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # Branch convention from the architecture: agents work on agent/<name>/<WO-id>.
      # This is what makes "an agent may not edit its own gate" mechanical rather
      # than a matter of trust.
      AGENT_AUTHORED: ${{ startsWith(github.head_ref || github.ref_name, 'agent/') && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The forbidden-remedy check diffs against the merge base, which needs
          # real history. A shallow clone would make it silently check nothing.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Studio/build/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run G2
        run: ./Studio/build/gate-g2.sh

      - name: Record evidence
        if: always()
        run: |
          VERDICT=${{ job.status == 'success' && 'pass' || 'fail' }}
          ./Studio/build/emit-evidence.sh \
            --tier T1 \
            --verdict "$VERDICT" \
            --by ci \
            --summary "G2 on ${{ github.ref_name }} (run ${{ github.run_number }})"

      # Uploaded rather than committed: CI writing to the repository would be an
      # unattended actor mutating kernel state. The founder or the orchestrator
      # commits a record when it is worth keeping.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-evidence-${{ github.run_number }}
          path: Studio/evidence/**/EVD-*.json
          if-no-files-found: warn
